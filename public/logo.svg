<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Outer ring gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1D8D" />
      <stop offset="30%" stop-color="#00A3FF" />
      <stop offset="70%" stop-color="#FFC107" />
      <stop offset="100%" stop-color="#00D26A" />
    </linearGradient>

    <!-- 3D Letter Gradients -->
    <linearGradient id="gradJ1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF66B2" />
      <stop offset="100%" stop-color="#E60067" />
    </linearGradient>
    <linearGradient id="gradO" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="gradJ2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#EAB308" />
    </linearGradient>
    <linearGradient id="gradI" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#86EFAC" />
      <stop offset="100%" stop-color="#22C55E" />
    </linearGradient>

    <!-- Blue and Pink badges -->
    <linearGradient id="blueBadge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="pinkBadge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#BE185D" />
    </linearGradient>

    <!-- Soft shadows -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.25" />
    </filter>
    <filter id="letterShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="5" stdDeviation="3" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Circular Base -->
  <circle cx="250" cy="250" r="245" fill="none" stroke="url(#ringGrad)" stroke-width="10" />
  <circle cx="250" cy="250" r="238" fill="#FFFFFF" />

  <!-- Confetti Stars & Dots -->
  <!-- Top stars -->
  <path d="M 105 110 L 110 95 L 115 110 L 130 115 L 115 120 L 110 135 L 105 120 L 90 115 Z" fill="#FF2A85" />
  <path d="M 360 95 L 365 80 L 370 95 L 385 100 L 370 105 L 365 120 L 360 105 L 345 100 Z" fill="#E11D48" />
  <path d="M 420 130 L 424 118 L 428 130 L 440 134 L 428 138 L 424 150 L 420 138 L 408 134 Z" fill="#FBBF24" />
  <circle cx="130" cy="150" r="6" fill="#F59E0B" />
  <circle cx="410" cy="175" r="7" fill="#84CC16" />
  <circle cx="440" cy="165" r="5" fill="#EC4899" />

  <!-- Blue Arc Smiley -->
  <path d="M 225 90 Q 250 115 275 90" fill="none" stroke="#00A3FF" stroke-width="6.5" stroke-linecap="round" />
  <ellipse cx="232" cy="72" rx="4" ry="7" fill="#00A3FF" />
  <ellipse cx="268" cy="72" rx="4" ry="7" fill="#00A3FF" />

  <!-- Cartoon Boy (Left) -->
  <g id="cartoonBoy" transform="translate(20, 140)">
    <!-- Boy Body -->
    <!-- Pants -->
    <path d="M 48 160 L 48 220 L 62 220 L 66 180 L 70 220 L 84 220 L 84 160 Z" fill="#2563EB" />
    <path d="M 48 160 L 84 160 L 82 165 L 50 165 Z" fill="#1D4ED8" />
    <!-- Shoes -->
    <ellipse cx="53" cy="225" rx="12" ry="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
    <ellipse cx="79" cy="225" rx="12" ry="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
    <path d="M 44 225 Q 53 222 62 225" stroke="#3B82F6" stroke-width="2" fill="none" />
    <path d="M 70 225 Q 79 222 88 225" stroke="#3B82F6" stroke-width="2" fill="none" />
    <!-- Yellow Jacket & White Tee -->
    <rect x="52" y="105" width="28" height="58" rx="6" fill="#FFFFFF" />
    <!-- Open Yellow Jacket -->
    <path d="M 40 105 Q 66 100 92 105 L 86 160 Q 66 162 46 160 Z" fill="#FACC15" />
    <path d="M 54 105 L 54 160 L 78 160 L 78 105 Z" fill="#FFFFFF" />
    <!-- Arms -->
    <path d="M 40 105 L 26 145 Q 28 152 38 148 L 46 120" fill="#EAB308" />
    <path d="M 92 105 L 106 145 Q 104 152 94 148 L 86 120" fill="#EAB308" />
    <circle cx="28" cy="152" r="7" fill="#FED7AA" />
    <circle cx="104" cy="152" r="7" fill="#FED7AA" />
    <!-- Boy Head -->
    <circle cx="66" cy="65" r="30" fill="#FED7AA" />
    <!-- Eyes & Smile -->
    <circle cx="56" cy="62" r="4.5" fill="#1E293B" />
    <circle cx="58" cy="60" r="1.5" fill="#FFFFFF" />
    <circle cx="76" cy="62" r="4.5" fill="#1E293B" />
    <circle cx="78" cy="60" r="1.5" fill="#FFFFFF" />
    <path d="M 59 74 Q 66 84 73 74" stroke="#DC2626" stroke-width="2.5" fill="#FCA5A5" stroke-linecap="round" />
    <!-- Brown hair -->
    <path d="M 36 60 Q 36 30 66 30 Q 96 30 96 60 Q 86 42 66 42 Q 46 42 36 60 Z" fill="#78350F" />
    <path d="M 42 38 Q 48 20 62 25 Q 76 22 84 32 Q 92 40 92 48" fill="#92400E" />
  </g>

  <!-- Cartoon Girl (Right) -->
  <g id="cartoonGirl" transform="translate(375, 140)">
    <!-- Legs -->
    <rect x="36" y="165" width="8" height="50" rx="4" fill="#FED7AA" />
    <rect x="54" y="165" width="8" height="50" rx="4" fill="#FED7AA" />
    <!-- Pink Shoes -->
    <ellipse cx="40" cy="222" rx="10" ry="5.5" fill="#EC4899" />
    <ellipse cx="58" cy="222" rx="10" ry="5.5" fill="#EC4899" />
    <!-- Pink Dress -->
    <path d="M 38 105 L 60 105 L 75 168 Q 49 174 23 168 Z" fill="#F43F5E" />
    <path d="M 34 105 Q 49 100 64 105 L 68 125 L 30 125 Z" fill="#FB7185" />
    <!-- Little Teddy Bear held by Girl -->
    <g transform="translate(48, 115)">
      <circle cx="16" cy="22" r="14" fill="#D97706" />
      <circle cx="16" cy="10" r="11" fill="#B45309" />
      <circle cx="8" cy="2" r="4" fill="#78350F" />
      <circle cx="24" cy="2" r="4" fill="#78350F" />
      <circle cx="13" cy="9" r="2" fill="#000" />
      <circle cx="19" cy="9" r="2" fill="#000" />
      <circle cx="16" cy="13" r="1.5" fill="#000" />
      <path d="M 16 16 L 16 19" stroke="#EF4444" stroke-width="2" />
    </g>
    <!-- Girl Head -->
    <circle cx="49" cy="65" r="29" fill="#FED7AA" />
    <!-- Eyes & Smile -->
    <circle cx="40" cy="63" r="4" fill="#1E293B" />
    <circle cx="41.5" cy="61" r="1.2" fill="#FFFFFF" />
    <circle cx="58" cy="63" r="4" fill="#1E293B" />
    <circle cx="59.5" cy="61" r="1.2" fill="#FFFFFF" />
    <path d="M 44 75 Q 49 83 54 75" stroke="#E11D48" stroke-width="2.5" fill="#FCA5A5" stroke-linecap="round" />
    <!-- Girl Brown Hair with Twin Ponytails -->
    <path d="M 20 62 Q 22 32 49 32 Q 76 32 78 62 Q 70 44 49 44 Q 28 44 20 62 Z" fill="#78350F" />
    <path d="M 22 55 Q 10 40 18 28 Q 24 35 26 48 Z" fill="#92400E" />
    <path d="M 76 55 Q 88 40 80 28 Q 74 35 72 48 Z" fill="#92400E" />
    <!-- Pink Hair Bow -->
    <g transform="translate(68, 25)">
      <polygon points="0,5 12,-2 12,12" fill="#EC4899" />
      <polygon points="12,5 24,-2 24,12" fill="#EC4899" />
      <circle cx="12" cy="5" r="4" fill="#BE185D" />
    </g>
  </g>

  <!-- Big 3D "JOJI" Lettering in Center -->
  <g id="lettersJOJI" transform="translate(130, 115)" filter="url(#letterShadow)">
    <!-- J (Pink) -->
    <text x="0" y="95" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="110" fill="url(#gradJ1)" stroke="#BE185D" stroke-width="4" stroke-linejoin="round">J</text>

    <!-- O (Cyan Blue) -->
    <text x="65" y="95" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="110" fill="url(#gradO)" stroke="#0369A1" stroke-width="4" stroke-linejoin="round">O</text>

    <!-- J (Yellow Gold) -->
    <text x="145" y="95" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="110" fill="url(#gradJ2)" stroke="#CA8A04" stroke-width="4" stroke-linejoin="round">J</text>

    <!-- I (Green) -->
    <text x="210" y="95" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="110" fill="url(#gradI)" stroke="#15803D" stroke-width="4" stroke-linejoin="round">I</text>
  </g>

  <!-- "KIDS ZONE" Banner -->
  <g id="kidsZoneBanner" transform="translate(115, 230)" filter="url(#dropShadow)">
    <rect x="0" y="0" width="270" height="46" rx="23" fill="url(#pinkBadge)" />
    <text x="135" y="32" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="28" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5">
      KIDS ZONE
    </text>
  </g>

  <!-- "KIDS WEAR & TOYS" Pill -->
  <g id="wearToysPill" transform="translate(135, 285)">
    <rect x="0" y="0" width="230" height="30" rx="15" fill="#FF1D8D" />
    <text x="115" y="20" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="14.5" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">
      KIDS WEAR &amp; TOYS
    </text>
  </g>

  <!-- 3 Mini Icons: Shirt | Bear | Car -->
  <g id="miniIcons" transform="translate(145, 325)">
    <!-- Blue T-shirt -->
    <path d="M 22 8 L 32 3 L 42 8 L 50 15 L 42 22 L 40 18 L 40 38 L 24 38 L 24 18 L 22 22 L 14 15 Z" fill="#0284C7" />
    <!-- Divider 1 -->
    <line x1="72" y1="8" x2="72" y2="35" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round" />
    <!-- Bear Icon -->
    <g transform="translate(90, 8)">
      <circle cx="16" cy="18" r="12" fill="#F59E0B" />
      <circle cx="16" cy="8" r="8" fill="#D97706" />
      <circle cx="8" cy="2" r="3.5" fill="#B45309" />
      <circle cx="24" cy="2" r="3.5" fill="#B45309" />
      <circle cx="13" cy="7" r="1.5" fill="#000" />
      <circle cx="19" cy="7" r="1.5" fill="#000" />
      <ellipse cx="16" cy="11" rx="2" ry="1" fill="#000" />
    </g>
    <!-- Divider 2 -->
    <line x1="140" y1="8" x2="140" y2="35" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round" />
    <!-- Pink Car Icon -->
    <g transform="translate(155, 12)">
      <path d="M 5 18 L 12 8 L 28 8 L 35 18 L 40 20 L 40 25 L 0 25 L 0 20 Z" fill="#EC4899" />
      <rect x="14" y="10" width="12" height="7" rx="1.5" fill="#BAE6FD" />
      <circle cx="10" cy="25" r="4.5" fill="#1E293B" />
      <circle cx="10" cy="25" r="2" fill="#E2E8F0" />
      <circle cx="30" cy="25" r="4.5" fill="#1E293B" />
      <circle cx="30" cy="25" r="2" fill="#E2E8F0" />
    </g>
  </g>

  <!-- Tagline -->
  <text x="250" y="380" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="13" fill="#1E293B" text-anchor="middle" letter-spacing="1">
    FASHION FOR KIDS &#8226; FUN FOR LIFE
  </text>

  <!-- Bottom Dark Blue Arc (Address & Phone) -->
  <g id="bottomBar">
    <path d="M 60 410 Q 250 510 440 410 C 420 455 350 488 250 488 C 150 488 80 455 60 410 Z" fill="#0F2D6B" />

    <!-- Location Pin & Dewas Address -->
    <g transform="translate(170, 436)">
      <!-- Pin -->
      <path d="M 0 0 C -4 -4 -6 -8 -6 -11 C -6 -15 -3 -18 1 -18 C 5 -18 8 -15 8 -11 C 8 -8 6 -4 2 0 Z" fill="#FACC15" />
      <circle cx="1" cy="-11" r="2.5" fill="#0F2D6B" />
      <text x="14" y="-7" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="12.5" fill="#FFFFFF" letter-spacing="0.5">
        120 A.B. ROAD, DEWAS
      </text>
    </g>

    <!-- Phone Icon & Number -->
    <g transform="translate(182, 462)">
      <!-- Phone Call -->
      <circle cx="0" cy="-4" r="9" fill="#FACC15" />
      <path d="M -3 -8 C -4 -7 -4 -5 -2 -3 C 0 -1 2 0 4 -1 L 5 -2 C 5 -3 4 -3 3 -4 L 2 -3 C 1 -3 0 -4 -1 -5 L 0 -6 C -1 -7 -2 -7 -2 -6 Z" fill="#0F2D6B" transform="translate(-1, 0) scale(0.9)" />
      <text x="15" y="0" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="14" fill="#FFFFFF" letter-spacing="1">
        7415432020
      </text>
    </g>
  </g>
</svg>
