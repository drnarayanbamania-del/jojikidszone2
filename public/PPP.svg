<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1f2" />
      <stop offset="35%" stop-color="#fdf2f8" />
      <stop offset="70%" stop-color="#fae8ff" />
      <stop offset="100%" stop-color="#fce7f3" />
    </linearGradient>

    <!-- Warm Festive Lighting Radial -->
    <radialGradient id="festiveGlow" cx="70%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#fbcfe8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#fae8ff" stop-opacity="0" />
    </radialGradient>

    <!-- Bottom Ribbon Gradient -->
    <linearGradient id="maroonRibbon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#831843" />
      <stop offset="50%" stop-color="#9d174d" />
      <stop offset="100%" stop-color="#be185d" />
    </linearGradient>

    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <linearGradient id="pinkText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#be123c" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>

    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1600" height="900" fill="url(#bgGlow)" />
  <rect width="1600" height="900" fill="url(#festiveGlow)" />

  <!-- Floating Sparkles & Hearts -->
  <g opacity="0.6">
    <circle cx="200" cy="180" r="4" fill="#fbbf24" />
    <circle cx="350" cy="90" r="3" fill="#ec4899" />
    <circle cx="850" cy="140" r="5" fill="#f59e0b" />
    <circle cx="1300" cy="110" r="4" fill="#fbbf24" />
    <circle cx="1450" cy="220" r="3" fill="#ec4899" />
    <circle cx="950" cy="280" r="4" fill="#f43f5e" />
    <circle cx="750" cy="500" r="3" fill="#fbbf24" />
  </g>

  <!-- TOP-LEFT BRAND LOGO & BADGE -->
  <g transform="translate(60, 40)">
    <!-- Kids illustration badge -->
    <circle cx="70" cy="65" r="42" fill="#bae6fd" />
    <circle cx="150" cy="65" r="42" fill="#fbcfe8" />
    <!-- Happy faces placeholders -->
    <text x="70" y="78" font-size="44" text-anchor="middle">👦</text>
    <text x="150" y="78" font-size="44" text-anchor="middle">👧</text>

    <!-- Brand Name -->
    <text x="110" y="155" font-family="'Fredoka', 'Poppins', 'Montserrat', sans-serif" font-weight="900" font-size="48" fill="#e11d48" text-anchor="middle" letter-spacing="1">
      JOJI
      <tspan fill="#0284c7"> KIDS</tspan>
      <tspan fill="#e11d48"> ZONE</tspan>
      <tspan font-size="20" dy="-20">®</tspan>
    </text>

    <!-- Ribbon: WEAR • PLAY • SMILE -->
    <rect x="15" y="172" width="190" height="28" rx="14" fill="#e11d48" />
    <text x="110" y="191" font-family="sans-serif" font-weight="800" font-size="12" fill="#ffffff" text-anchor="middle" letter-spacing="2">
      WEAR • PLAY • SMILE
    </text>

    <!-- Subtitle: Dewas Store -->
    <text x="110" y="222" font-family="sans-serif" font-weight="700" font-size="13" fill="#881337" text-anchor="middle" letter-spacing="1">
      Kids Wear &amp; Toys Store
    </text>
    <text x="110" y="240" font-family="sans-serif" font-weight="800" font-size="13" fill="#be123c" text-anchor="middle">
      —— Dewas ——
    </text>
    <text x="110" y="258" font-size="14" fill="#e11d48" text-anchor="middle">❤</text>
  </g>

  <!-- LEFT CATEGORY PILLS (Girls Wear, Boys Wear, Toys, Accessories) -->
  <g transform="translate(60, 360)">
    <!-- Girls Wear -->
    <g transform="translate(0, 0)">
      <circle cx="30" cy="25" r="24" fill="#ec4899" />
      <text x="30" y="34" font-size="22" text-anchor="middle">👗</text>
      <text x="68" y="22" font-family="sans-serif" font-weight="900" font-size="14" fill="#831843">GIRLS</text>
      <text x="68" y="38" font-family="sans-serif" font-weight="900" font-size="14" fill="#831843">WEAR</text>
    </g>

    <!-- Boys Wear -->
    <g transform="translate(0, 68)">
      <circle cx="30" cy="25" r="24" fill="#0284c7" />
      <text x="30" y="34" font-size="22" text-anchor="middle">👕</text>
      <text x="68" y="22" font-family="sans-serif" font-weight="900" font-size="14" fill="#0c4a6e">BOYS</text>
      <text x="68" y="38" font-family="sans-serif" font-weight="900" font-size="14" fill="#0c4a6e">WEAR</text>
    </g>

    <!-- Toys & Gifts -->
    <g transform="translate(0, 136)">
      <circle cx="30" cy="25" r="24" fill="#f59e0b" />
      <text x="30" y="34" font-size="22" text-anchor="middle">🧸</text>
      <text x="68" y="22" font-family="sans-serif" font-weight="900" font-size="14" fill="#78350f">TOYS</text>
      <text x="68" y="38" font-family="sans-serif" font-weight="900" font-size="14" fill="#78350f">&amp; GIFTS</text>
    </g>

    <!-- Kids Accessories -->
    <g transform="translate(0, 204)">
      <circle cx="30" cy="25" r="24" fill="#10b981" />
      <text x="30" y="34" font-size="22" text-anchor="middle">👜</text>
      <text x="68" y="22" font-family="sans-serif" font-weight="900" font-size="14" fill="#064e3b">KIDS</text>
      <text x="68" y="38" font-family="sans-serif" font-weight="900" font-size="14" fill="#064e3b">ACCESSORIES</text>
    </g>

    <!-- Little Outfits Big Happiness -->
    <text x="10" y="300" font-family="'Brush Script MT', 'Dancing Script', cursive, sans-serif" font-style="italic" font-weight="900" font-size="26" fill="#be123c">
      Little Outfits Big Happiness ❤
    </text>
  </g>

  <!-- CENTER MODEL: Pink Lehenga Girl & Festive Boutique -->
  <g transform="translate(480, 50)">
    <!-- Soft festive boutique backdrop -->
    <rect x="0" y="20" width="460" height="710" rx="30" fill="#fdf4ff" opacity="0.6" />
    
    <!-- Ethnic lehenga visual illustration -->
    <circle cx="230" cy="210" r="95" fill="#fbcfe8" />
    <!-- Girl face & hair -->
    <text x="230" y="245" font-size="110" text-anchor="middle">👧</text>

    <!-- Embellished pink festive lehenga choli -->
    <path d="M 120 370 Q 230 330 340 370 L 410 650 Q 230 710 50 650 Z" fill="#f472b6" opacity="0.9" />
    <path d="M 140 380 Q 230 345 320 380 L 390 640 Q 230 690 70 640 Z" fill="#db2777" opacity="0.65" />
    <!-- Golden embroidery motifs -->
    <circle cx="230" cy="460" r="16" fill="#fbbf24" opacity="0.8" />
    <circle cx="180" cy="520" r="12" fill="#fbbf24" opacity="0.8" />
    <circle cx="280" cy="520" r="12" fill="#fbbf24" opacity="0.8" />
    <circle cx="150" cy="600" r="14" fill="#fbbf24" opacity="0.8" />
    <circle cx="230" cy="610" r="14" fill="#fbbf24" opacity="0.8" />
    <circle cx="310" cy="600" r="14" fill="#fbbf24" opacity="0.8" />
    
    <text x="230" y="700" font-family="'Dancing Script', cursive, sans-serif" font-weight="900" font-size="28" fill="#be123c" text-anchor="middle">
      Fashion for Little Stars ♡
    </text>
  </g>

  <!-- RIGHT SIDE: FESTIVE SEASON ETHNIC WEAR HEADLINES -->
  <g transform="translate(980, 80)">
    <!-- Little Heart Icon -->
    <text x="20" y="60" font-size="34" fill="#e11d48">♡</text>

    <!-- Main Title: Festive Season -->
    <text x="70" y="80" font-family="'Playfair Display', 'Brush Script MT', 'Dancing Script', Georgia, serif" font-style="italic" font-weight="900" font-size="82" fill="url(#pinkText)">
      Festive
    </text>
    <text x="90" y="165" font-family="'Playfair Display', 'Brush Script MT', Georgia, serif" font-style="italic" font-weight="900" font-size="84" fill="url(#pinkText)">
      Season
    </text>

    <!-- Subtitle: ETHNIC WEAR -->
    <text x="200" y="225" font-family="'Montserrat', 'Poppins', sans-serif" font-weight="900" font-size="26" fill="#881337" letter-spacing="6">
      ETHNIC WEAR
    </text>
    
    <text x="280" y="260" font-size="22" fill="#f59e0b" text-anchor="middle">✻</text>

    <!-- Poetic Tagline -->
    <text x="280" y="305" font-family="'Brush Script MT', 'Dancing Script', cursive, sans-serif" font-style="italic" font-weight="900" font-size="32" fill="#be123c" text-anchor="middle">
      Dress Up
    </text>
    <text x="280" y="345" font-family="'Brush Script MT', 'Dancing Script', cursive, sans-serif" font-style="italic" font-weight="900" font-size="32" fill="#be123c" text-anchor="middle">
      Little Moments
    </text>
    <text x="280" y="385" font-family="'Brush Script MT', 'Dancing Script', cursive, sans-serif" font-style="italic" font-weight="900" font-size="32" fill="#be123c" text-anchor="middle">
      Create Big Memories
    </text>
    <text x="280" y="420" font-size="26" fill="#be123c" text-anchor="middle">♡</text>

    <!-- Framed Board in Room -->
    <g transform="translate(140, 450)">
      <rect x="0" y="0" width="280" height="190" rx="14" fill="#ffffff" stroke="#d97706" stroke-width="5" filter="url(#dropShadow)" />
      <text x="140" y="55" font-family="sans-serif" font-weight="900" font-size="18" fill="#475569" text-anchor="middle" letter-spacing="2">
        CUTE
      </text>
      <text x="140" y="85" font-family="sans-serif" font-weight="900" font-size="18" fill="#475569" text-anchor="middle" letter-spacing="2">
        OUTFITS
      </text>
      <text x="140" y="115" font-family="sans-serif" font-weight="900" font-size="18" fill="#475569" text-anchor="middle" letter-spacing="2">
        FOR
      </text>
      <text x="140" y="145" font-family="sans-serif" font-weight="900" font-size="18" fill="#475569" text-anchor="middle" letter-spacing="2">
        BRIGHTER
      </text>
      <text x="140" y="170" font-family="sans-serif" font-weight="900" font-size="14" fill="#be123c" text-anchor="middle" letter-spacing="2">
        TOMORROWS ❤
      </text>
    </g>

    <!-- Teddy Bear & Festive Lamps -->
    <text x="80" y="590" font-size="80">🧸</text>
    <text x="40" y="650" font-size="40">🏮</text>
    <text x="450" y="650" font-size="40">🏮</text>
  </g>

  <!-- BOTTOM RIBBON (WHATSAPP, ADDRESS, BADGES) -->
  <g transform="translate(0, 785)">
    <!-- Dark Magenta Ribbon Background -->
    <rect x="0" y="0" width="1600" height="115" fill="url(#maroonRibbon)" />
    <!-- Gold accent top line -->
    <rect x="0" y="0" width="1600" height="4" fill="url(#goldGradient)" />

    <!-- WhatsApp Section -->
    <g transform="translate(40, 20)">
      <circle cx="36" cy="38" r="34" fill="#22c55e" />
      <text x="36" y="50" font-size="38" text-anchor="middle" fill="#ffffff">💬</text>
      
      <text x="88" y="28" font-family="sans-serif" font-weight="800" font-size="15" fill="#fecdd3" letter-spacing="1">
        WhatsApp:
      </text>
      <text x="88" y="62" font-family="'Poppins', 'Montserrat', sans-serif" font-weight="900" font-size="34" fill="#ffffff" letter-spacing="2">
        9893380637
      </text>
    </g>

    <!-- Divider -->
    <line x1="430" y1="20" x2="430" y2="95" stroke="#ffffff" stroke-opacity="0.3" stroke-width="2" />

    <!-- Store Address: 120 A.B. Road, Dewas -->
    <g transform="translate(460, 28)">
      <circle cx="28" cy="30" r="22" fill="#ffffff" />
      <text x="28" y="40" font-size="24" text-anchor="middle">📍</text>

      <text x="64" y="42" font-family="'Poppins', 'Montserrat', sans-serif" font-weight="800" font-size="24" fill="#ffffff">
        120 A.B. Road, Dewas
      </text>
    </g>

    <!-- Divider -->
    <line x1="880" y1="20" x2="880" y2="95" stroke="#ffffff" stroke-opacity="0.3" stroke-width="2" />

    <!-- Store Feature Badges -->
    <g transform="translate(910, 32)">
      <!-- Trendy Collection -->
      <g transform="translate(0, 0)">
        <text x="0" y="28" font-size="26">👑</text>
        <text x="36" y="20" font-family="sans-serif" font-weight="800" font-size="13" fill="#ffffff">Trendy</text>
        <text x="36" y="36" font-family="sans-serif" font-weight="800" font-size="13" fill="#ffffff">Collection</text>
      </g>

      <!-- Best Quality -->
      <g transform="translate(160, 0)">
        <text x="0" y="28" font-size="26">🤍</text>
        <text x="36" y="20" font-family="sans-serif" font-weight="800" font-size="13" fill="#ffffff">Best</text>
        <text x="36" y="36" font-family="sans-serif" font-weight="800" font-size="13" fill="#ffffff">Quality</text>
      </g>

      <!-- Happy Kids -->
      <g transform="translate(300, 0)">
        <text x="0" y="28" font-size="26">😃</text>
        <text x="36" y="20" font-family="sans-serif" font-weight="800" font-size="13" fill="#ffffff">Happy</text>
        <text x="36" y="36" font-family="sans-serif" font-weight="800" font-size="13" fill="#ffffff">Kids</text>
      </g>

      <!-- Affordable Prices -->
      <g transform="translate(440, 0)">
        <text x="0" y="28" font-size="26">🏷️</text>
        <text x="36" y="20" font-family="sans-serif" font-weight="800" font-size="13" fill="#ffffff">Affordable</text>
        <text x="36" y="36" font-family="sans-serif" font-weight="800" font-size="13" fill="#ffffff">Prices</text>
      </g>
    </g>

    <!-- Decorative Corner Bow -->
    <text x="1560" y="65" font-size="44" text-anchor="middle">🎀</text>
  </g>
</svg>
